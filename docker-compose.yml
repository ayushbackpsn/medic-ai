version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///asha_health.db
      - JWT_SECRET=asha_rural_health_secret_key_2026
    volumes:
      - ./backend/data:/app/data
      - ./backend/ml:/app/ml

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
