<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0284c7" />
    <link rel="manifest" href="/manifest.json" />
    <title>ASHA – Rural Health Triage System</title>
  </head>
  <body class="bg-gray-50 font-sans text-gray-900 antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('ASHA ServiceWorker registered with scope: ', registration.scope);
            },
            (err) => {
              console.log('ASHA ServiceWorker registration failed: ', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
