services:
  # ── Backend Web Service (FastAPI) ──────────────────────────────────────────
  - type: web
    name: asha-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --prefer-binary -r requirements.txt && python ml/train_model.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asha-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0

  # ── Frontend Static Site (React + Vite) ────────────────────────────────────
  - type: web
    name: asha-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://asha-backend.onrender.com

databases:
  # ── Free PostgreSQL ─────────────────────────────────────────────────────────
  - name: asha-db
    plan: free
    databaseName: asha_health
    user: asha_admin
